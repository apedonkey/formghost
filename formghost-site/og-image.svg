<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="200" fill="#0066ff" opacity="0.05"/>
  <circle cx="100" cy="530" r="150" fill="#0066ff" opacity="0.05"/>

  <!-- Logo area -->
  <rect x="80" y="80" width="48" height="48" rx="10" fill="#0066ff"/>
  <text x="104" y="114" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="600" fill="white" text-anchor="middle">F</text>
  <text x="148" y="114" font-family="'IBM Plex Mono', monospace, system-ui" font-size="24" font-weight="500" fill="#1a1a1a">FormGhost</text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" font-size="56" font-weight="600" fill="#1a1a1a">
    <tspan x="80" dy="0">Find out what AI says</tspan>
    <tspan x="80" dy="70">when you're not in the room</tspan>
  </text>

  <!-- Subheadline -->
  <text x="80" y="430" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" font-size="24" fill="#525252">
    <tspan x="80" dy="0">Discover the real prompts people ask about your industry.</tspan>
    <tspan x="80" dy="36">See where you're invisible and competitors aren't.</tspan>
  </text>

  <!-- Badge -->
  <rect x="80" y="520" width="180" height="36" rx="18" fill="#0066ff"/>
  <text x="170" y="545" font-family="'IBM Plex Mono', monospace, system-ui" font-size="14" font-weight="500" fill="white" text-anchor="middle">AI VISIBILITY TOOL</text>

  <!-- Domain -->
  <text x="1120" y="590" font-family="'IBM Plex Mono', monospace, system-ui" font-size="18" fill="#737373" text-anchor="end">formghost.app</text>
</svg>
